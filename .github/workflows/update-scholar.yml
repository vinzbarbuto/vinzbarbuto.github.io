name: Update Google Scholar Stats

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:   # Allow manual trigger from the Actions tab

permissions:
  contents: write      # Needed to commit & push the updated JSON

jobs:
  update-scholar:
    name: Fetch Scholar Stats
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out the repository ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install scholarly
        run: pip install scholarly

      # ── 4. Run the fetch script ──────────────────────────────────────────
      - name: Fetch Scholar stats
        id: fetch
        # If scholarly hits a CAPTCHA, the script exits non-zero.
        # We use `continue-on-error` so the workflow doesn't fail noisily —
        # it simply skips the commit step and retains the previous JSON.
        continue-on-error: true
        run: python scripts/fetch_scholar.py

      # ── 5. Commit & push if the JSON changed ─────────────────────────────
      - name: Commit updated stats
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/scholar-stats.json
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: update scholar stats [skip ci]"
          git push
